<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#0a0f1d" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="crimsonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#be123c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#9f1239" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#4f46e5" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0" />
    </radialGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.4" />
      <circle cx="0" cy="0" r="1" fill="#334155" fill-opacity="0.5" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" fill="url(#bgGrad)" />
  <rect width="1200" height="380" fill="url(#grid)" />
  <circle cx="600" cy="190" r="350" fill="url(#centerGlow)" />

  <!-- Geometric Accent Borders -->
  <line x1="0" y1="1" x2="1200" y2="1" stroke="url(#crimsonGlow)" stroke-width="2" />
  <line x1="0" y1="379" x2="1200" y2="379" stroke="url(#crimsonGlow)" stroke-width="1.5" stroke-opacity="0.7" />

  <!-- Left Cyber / HUD Accents -->
  <path d="M 40 40 L 80 40 L 95 55 L 40 55 Z" fill="#e11d48" fill-opacity="0.2" />
  <text x="45" y="50" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" fill="#fb7185" letter-spacing="1.5">SIH 2026 // PS-26104</text>
  
  <rect x="170" y="40" width="130" height="15" rx="3" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="0.8" />
  <circle cx="180" cy="47.5" r="3" fill="#10b981" />
  <text x="190" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#94a3b8" letter-spacing="0.8">SYSTEM ACTIVE (PROD)</text>

  <!-- Title & Branding -->
  <g transform="translate(60, 140)">
    <!-- Logo Icon -->
    <g transform="translate(0, -50)">
      <polygon points="28,2 54,16 54,46 28,60 2,46 2,16" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="2.5" />
      <!-- Soundwave inside shield -->
      <line x1="14" y1="31" x2="14" y2="31" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" />
      <line x1="19" y1="25" x2="19" y2="37" stroke="#fb7185" stroke-width="2.5" stroke-linecap="round" />
      <line x1="24" y1="19" x2="24" y2="43" stroke="#e11d48" stroke-width="2.5" stroke-linecap="round" />
      <line x1="28" y1="14" x2="28" y2="48" stroke="#ffffff" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
      <line x1="32" y1="20" x2="32" y2="42" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" />
      <line x1="37" y1="26" x2="37" y2="36" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
      <line x1="42" y1="31" x2="42" y2="31" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- Main Title Text -->
    <text x="75" y="-5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" letter-spacing="-1">SATYA<tspan fill="url(#accentGrad)">VOICE</tspan></text>
    
    <!-- Subtitle -->
    <text x="75" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.2">
      Real-Time Voice Deepfake &amp; Call-Fraud Defense Platform
    </text>

    <!-- Feature Description -->
    <text x="75" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" letter-spacing="0.1">
      Multi-Signal Acoustic Anti-Spoofing • Contextual Intent ASR • Speaker Vault • Merkle Tree Proofs • Polygon Amoy Anchoring
    </text>
  </g>

  <!-- Interactive Pipeline Badges in Banner -->
  <g transform="translate(60, 260)">
    <!-- Stage 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="52" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#e11d48" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fb7185" letter-spacing="0.8">01 / ACOUSTIC SPOOF</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">MMS-300M (ZeroGPU)</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M 195 26 L 215 26" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="215,23 222,26 215,29" fill="#475569" />

    <!-- Stage 2 -->
    <g transform="translate(235, 0)">
      <rect width="180" height="52" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#3b82f6" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" letter-spacing="0.8">02 / CONTEXT &amp; ID</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Whisper + ECAPA</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M 430 26 L 450 26" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="450,23 457,26 450,29" fill="#475569" />

    <!-- Stage 3 -->
    <g transform="translate(470, 0)">
      <rect width="180" height="52" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#f59e0b" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" letter-spacing="0.8">03 / RISK FUSION</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Deterministic Formula</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M 665 26 L 685 26" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="685,23 692,26 685,29" fill="#475569" />

    <!-- Stage 4 -->
    <g transform="translate(705, 0)">
      <rect width="180" height="52" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#1e293b" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#8b5cf6" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#a78bfa" letter-spacing="0.8">04 / EVIDENCE MERKLE</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">RFC 8785 + SHA-256</text>
    </g>

    <!-- Arrow 4 -->
    <path d="M 900 26 L 920 26" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,3" />
    <polygon points="920,23 927,26 920,29" fill="#475569" />

    <!-- Stage 5 -->
    <g transform="translate(940, 0)">
      <rect width="180" height="52" rx="8" fill="#0f172a" fill-opacity="0.85" stroke="#8b5cf6" stroke-width="1.2" />
      <rect x="0" y="0" width="4" height="52" rx="2" fill="#10b981" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34d399" letter-spacing="0.8">05 / ON-CHAIN ANCHOR</text>
      <text x="16" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Polygon Amoy (80002)</text>
    </g>
  </g>

  <!-- Right Decorative Telemetry Box -->
  <g transform="translate(920, 45)">
    <rect width="220" height="150" rx="8" fill="#0a0f1d" fill-opacity="0.9" stroke="#1e293b" stroke-width="1" />
    
    <text x="15" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#64748b" letter-spacing="1">LIVE TELEMETRY SPECS</text>
    
    <text x="15" y="50" font-family="monospace" font-size="11" fill="#94a3b8">RATE:    <tspan fill="#f1f5f9">16,000 Hz</tspan></text>
    <text x="15" y="70" font-family="monospace" font-size="11" fill="#94a3b8">WINDOW:  <tspan fill="#f1f5f9">4.0s (64k spl)</tspan></text>
    <text x="15" y="90" font-family="monospace" font-size="11" fill="#94a3b8">HOP:     <tspan fill="#f1f5f9">0.5s (8k spl)</tspan></text>
    <text x="15" y="110" font-family="monospace" font-size="11" fill="#94a3b8">VAD:     <tspan fill="#10b981">Silero Active</tspan></text>
    <text x="15" y="130" font-family="monospace" font-size="11" fill="#94a3b8">CHAIN:   <tspan fill="#a78bfa">Polygon 80002</tspan></text>

    <!-- Mini pulse wave -->
    <path d="M 140 20 Q 150 10 160 20 T 180 20 T 200 20" fill="none" stroke="#e11d48" stroke-width="1.5" stroke-opacity="0.8" />
  </g>
</svg>
